<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎯</text></svg>">
<title>Habit Tracker | Трекер привычек</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Новая цветовая палитра (Modern Light) */
  --bg-body: #f4f7f6;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f9fafb;
  
  --primary: #6366f1;      /* Индиго */
  --primary-hover: #4f46e5;
  --primary-light: #e0e7ff;
  
  --success: #10b981;      /* Зеленый */
  --success-bg: #d1fae5;
  --danger: #ef4444;       /* Красный */
  --warning: #f59e0b;      /* Оранжевый */
  
  --text-main: #111827;
  --text-muted: #6b7280;
  
  --border: #e5e7eb;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --scale-factor: 1;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-body);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  line-height: 1.5;
  font-size: 15px;
}

.container {
  width: 100%;
  max-width: 700px;
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 30px;
  margin-top: 20px;
  margin-bottom: 40px;
}

/* ================= HEADER ================= */
.top-bar {
  text-align: center;
  margin-bottom: 25px;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.5px;
}

/* ================= TABS ================= */
.tabs {
  display: flex;
  background: var(--bg-body);
  padding: 4px;
  border-radius: var(--radius-md);
  margin-bottom: 25px;
}

.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 15px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
}

.tab-btn:hover {
  color: var(--text-main);
}

.tab-btn.active {
  background: var(--bg-surface);
  color: var(--primary);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* ================= COMMON UI ================= */
.btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 16px;
  color: var(--text-main);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:hover:not(:disabled) {
  background: var(--bg-surface-hover);
  border-color: #d1d5db;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-green { background: var(--success); color: white; border-color: var(--success); }
.btn-green:hover:not(:disabled) { background: #059669; border-color: #059669; }

.btn-red { background: var(--danger); color: white; border-color: var(--danger); }
.btn-red:hover:not(:disabled) { background: #dc2626; border-color: #dc2626; }

.btn-blue { background: var(--primary); color: white; border-color: var(--primary); }
.btn-blue:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

.btn-big {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
}

.add-form {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.add-form.hidden { display: none; }

.add-input {
  flex: 1;
  min-width: 150px;
  background: var(--bg-body);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  padding: 12px 16px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.add-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
  background: var(--bg-surface);
}

/* Скрываем стрелочки у number */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

/* ================= TASKS ================= */
.date-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  background: var(--bg-body);
  padding: 10px;
  border-radius: var(--radius-md);
}

.date-display {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  text-align: center;
}

.progress-section {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.progress-bar-container {
  background: var(--bg-body);
  border-radius: 99px;
  height: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--success);
  width: 0%;
  border-radius: 99px;
  transition: width 0.4s ease;
}

.items-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.item {
  display: flex;
  align-items: center;
  gap: 15px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 15px;
  transition: all 0.2s ease;
}

.item:hover {
  border-color: #d1d5db;
  box-shadow: var(--shadow-sm);
}

.item.done {
  background: #f8fafc;
  border-color: var(--border);
  opacity: 0.7;
}

.item.done .item-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.item-checkbox {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border: 2px solid #d1d5db;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  background: var(--bg-surface);
}

.item-checkbox:hover { border-color: var(--success); }

.item-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}

.item-checkbox.checked::after {
  content: '';
  width: 6px;
  height: 12px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  margin-bottom: 2px;
}

.item-text {
  flex: 1;
  font-size: 15px;
  color: var(--text-main);
  word-break: break-word;
}

.item-delete, .item-edit {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.item-delete:hover { color: var(--danger); background: #fee2e2; }
.item-edit:hover { color: var(--primary); background: var(--primary-light); }

/* ================= HABITS ================= */
.habit-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 15px;
}

.habit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  flex-wrap: wrap;
  gap: 10px;
}

.habit-name {
  font-size: 16px;
  font-weight: 600;
}

.habit-streak {
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
}

.habit-stats {
  display: flex;
  gap: 15px;
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 12px;
}

.habits-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.habit-day-header {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  padding-bottom: 5px;
}

.habit-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-body);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.habit-day:hover { background: #e5e7eb; }
.habit-day.done { background: var(--success); }
.habit-day.missed { background: #fee2e2; cursor: not-allowed; }
.habit-day.today { border-color: var(--primary); }
.habit-day.future { opacity: 0.4; cursor: not-allowed; }

.fix-btn-wrapper { margin-top: 15px; }

.fix-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--primary);
  font-weight: 500;
  font-size: 13px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}
.fix-btn:hover { background: var(--primary-light); border-color: var(--primary); }

/* ================= TRAINING ================= */
.week-days {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.week-day-btn {
  flex: 1;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 4px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
}

.week-day-btn:hover { background: var(--bg-surface-hover); }
.week-day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.week-day-btn.today { border-color: var(--primary); border-width: 2px; }

.copy-menu {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
  background: var(--bg-body);
  padding: 12px;
  border-radius: var(--radius-md);
}

.copy-menu span {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
}

.copy-menu .btn {
  padding: 6px 12px;
  font-size: 13px;
}

.exercise-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  transition: all 0.2s ease;
}

.exercise-item.active {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.exercise-item.done { opacity: 0.6; background: #f8fafc; }
.exercise-item.done .exercise-name { text-decoration: line-through; color: var(--text-muted); }
.exercise-item.dragging { opacity: 0.4; border-style: dashed; }

.exercise-num {
  min-width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-body);
  border-radius: 50%;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}

.exercise-item.done .exercise-num { background: var(--success); color: white; }
.exercise-item.active .exercise-num { background: var(--primary); color: white; }

.drag-handle {
  cursor: grab;
  color: var(--text-muted);
  font-size: 18px;
  user-select: none;
}
.drag-handle:active { cursor: grabbing; }

.exercise-name {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
}

.exercise-time {
  background: var(--bg-body);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.exercise-time.rest { color: var(--warning); background: #fef3c7; }

.start-training-box {
  background: var(--bg-body);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
}

.start-training-hint {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 10px;
}

.active-timer {
  text-align: center;
  font-size: 48px;
  font-weight: 700;
  color: var(--text-main);
  margin: 15px 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
}

.active-timer.finished { color: var(--success); }

.training-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  justify-content: center;
}

/* ================= MODAL & TOAST ================= */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  font-size: 14px;
  font-weight: 500;
  animation: toastIn 0.3s ease;
}
.toast.warning { background: var(--danger); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.5);
  backdrop-filter: blur(4px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 400px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalPop {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-text {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 20px;
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .container { padding: 20px; margin-top: 10px; }
  .active-timer { font-size: 36px; }
  .tab-btn { font-size: 13px; padding: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar"><h1>Habit Tracker</h1></div>

  <div class="tabs">
    <button class="tab-btn active" id="tabTasks" onclick="switchTab('tasks')">Задачи</button>
    <button class="tab-btn" id="tabHabits" onclick="switchTab('habits')">Привычки</button>
    <button class="tab-btn" id="tabTraining" onclick="switchTab('training')">Тренировка</button>
  </div>

  <!-- ===================== ЗАДАЧИ ===================== -->
  <div id="tasksTab">
    <div class="date-nav">
      <button class="btn" onclick="changeDate(-1)">◀</button>
      <div class="date-display" id="dateDisplay"></div>
      <button class="btn" onclick="changeDate(1)">▶</button>
    </div>
    <button class="btn btn-green btn-big" onclick="goToday()">Сегодня</button>
    
    <div class="progress-section">
      <div class="progress-label">
        <span>Прогресс</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div class="add-form">
      <input type="text" class="add-input" id="taskInput" placeholder="Новая задача..." maxlength="100">
      <button class="btn btn-green" onclick="addTask()">Добавить</button>
    </div>
    <div class="items-list" id="tasksList"></div>
  </div>

  <!-- ===================== ПРИВЫЧКИ ===================== -->
  <div id="habitsTab" style="display:none;">
    <div class="add-form">
      <input type="text" class="add-input" id="habitInput" placeholder="Новая привычка..." maxlength="100">
      <button class="btn btn-green" onclick="addHabit()">Добавить</button>
    </div>
    <div id="habitsList"></div>
  </div>

  <!-- ===================== ТРЕНИРОВКА ===================== -->
  <div id="trainingTab" style="display:none;">
    
    <div class="week-days" id="weekDays">
      <button class="week-day-btn" onclick="selectDay(0)">ПН</button>
      <button class="week-day-btn" onclick="selectDay(1)">ВТ</button>
      <button class="week-day-btn" onclick="selectDay(2)">СР</button>
      <button class="week-day-btn" onclick="selectDay(3)">ЧТ</button>
      <button class="week-day-btn" onclick="selectDay(4)">ПТ</button>
      <button class="week-day-btn" onclick="selectDay(5)">СБ</button>
      <button class="week-day-btn" onclick="selectDay(6)">ВС</button>
    </div>

    <div class="copy-menu" id="copyMenu" style="display:none;">
      <span>Копировать в:</span>
      <button class="btn btn-blue" onclick="copyToDay(0)">ПН</button>
      <button class="btn btn-blue" onclick="copyToDay(1)">ВТ</button>
      <button class="btn btn-blue" onclick="copyToDay(2)">СР</button>
      <button class="btn btn-blue" onclick="copyToDay(3)">ЧТ</button>
      <button class="btn btn-blue" onclick="copyToDay(4)">ПТ</button>
      <button class="btn btn-blue" onclick="copyToDay(5)">СБ</button>
      <button class="btn btn-blue" onclick="copyToDay(6)">ВС</button>
    </div>

    <div class="add-form" id="exerciseForm">
      <input type="text" class="add-input" id="exerciseInput" placeholder="Упражнение..." maxlength="60">
      <input type="number" class="add-input" id="exerciseTime" placeholder="Сек" min="5" max="600" value="30" style="max-width:100px;">
      <button class="btn btn-green" onclick="addExercise()">Добавить</button>
    </div>

    <div class="start-training-box" id="startTrainingBox" style="display:none;">
      <button class="btn btn-green btn-big" onclick="startTraining()">Начать тренировку</button>
      <div class="start-training-hint" id="startTrainingHint"></div>
    </div>

    <div class="progress-section" id="trainingActive" style="display:none;">
      <div class="progress-label">
        <span>Сейчас: <strong id="activeExerciseName">—</strong></span>
        <span id="activeExerciseStep">1 / 1</span>
      </div>
      <div class="active-timer" id="activeExerciseTimer" aria-live="polite" role="timer">00:00</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="activeExerciseProgress" style="width:0%;"></div>
      </div>
      <div class="training-actions">
        <button class="btn btn-green" id="btnNextExercise" disabled onclick="nextExercise()">Следующее</button>
        <button class="btn btn-red" onclick="resetTraining()">Сброс</button>
      </div>
      <div class="habit-stats" style="margin-top:10px;justify-content:center;">
        <span id="trainingHint">Дождитесь окончания таймера</span>
      </div>
    </div>

    <div class="items-list" id="exercisesList"></div>
  </div>
</div>

<script>
/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
var currentTab = 'tasks';
var currentDate = new Date();
currentDate.setHours(0,0,0,0);
var tasks = loadTasks();
var habits = loadHabits();

var exercisesData = loadExercises(); 
var currentDayIndex = (new Date().getDay() + 6) % 7; 
var training = {
  activeIndex: -1,   
  endTime: 0,        
  total: 0,          
  timerId: null,     
  doneSet: {},       
  started: false     
};

var MONTHS = ['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря'];
var DAYS_SHORT = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

/* ============================================================
   ХРАНИЛИЩЕ И УТИЛИТЫ
   ============================================================ */
function loadTasks(){ try{ var s = localStorage.getItem('ht_tasks'); if(s) return JSON.parse(s); }catch(e){} return {}; }
function saveTasks(){ try{ localStorage.setItem('ht_tasks', JSON.stringify(tasks)); }catch(e){} }
function loadHabits(){ try{ var s = localStorage.getItem('ht_habits'); if(s) return JSON.parse(s); }catch(e){} return []; }
function saveHabits(){ try{ localStorage.setItem('ht_habits', JSON.stringify(habits)); }catch(e){} }
function loadExercises(){ 
  try{ 
    var s = localStorage.getItem('ht_exercises_v2'); 
    if(s) return JSON.parse(s); 
  }catch(e){} 
  return {"0":[],"1":[],"2":[],"3":[],"4":[],"5":[],"6":[]}; 
}
function saveExercises(){ try{ localStorage.setItem('ht_exercises_v2', JSON.stringify(exercisesData)); }catch(e){} }

function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function escapeHtml(text){ if(!text) return ''; return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function formatTime(sec){ var m = Math.floor(sec / 60); var s = sec % 60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }

function showToast(msg, warn){
  var t = document.querySelector('.toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className = 'toast' + (warn ? ' warning' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t && t.parentNode) t.remove(); }, 2500);
}
function showConfirm(message, onYes, onNo){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  var box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = '<div class="modal-text">' + escapeHtml(message) + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn" id="modalNo">Отмена</button>' +
      '<button class="btn btn-green" id="modalYes">Да</button>' +
    '</div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  function close(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  box.querySelector('#modalYes').onclick = function(){ close(); if(onYes) onYes(); };
  box.querySelector('#modalNo').onclick = function(){ close(); if(onNo) onNo(); };
  overlay.onclick = function(e){ if(e.target === overlay){ close(); if(onNo) onNo(); } };
  box.querySelector('#modalYes').focus();
}

/* ============================================================
   ВКЛАДКИ И ЗАДАЧИ
   ============================================================ */
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabTasks').classList.toggle('active', tab === 'tasks');
  document.getElementById('tabHabits').classList.toggle('active', tab === 'habits');
  document.getElementById('tabTraining').classList.toggle('active', tab === 'training');
  document.getElementById('tasksTab').style.display = tab === 'tasks' ? 'block' : 'none';
  document.getElementById('habitsTab').style.display = tab === 'habits' ? 'block' : 'none';
  document.getElementById('trainingTab').style.display = tab === 'training' ? 'block' : 'none';
  
  if(tab === 'tasks') renderTasks();
  else if(tab === 'habits') renderHabits();
  else renderTraining();
}

function changeDate(delta){ currentDate.setDate(currentDate.getDate() + delta); renderTasks(); }
function goToday(){ currentDate = new Date(); currentDate.setHours(0,0,0,0); renderTasks(); }

function renderTasks(){
  var dk = dateKey(currentDate);
  var today = new Date(); today.setHours(0,0,0,0);
  var isToday = currentDate.getTime() === today.getTime();
  var display = currentDate.getDate() + ' ' + MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  if(isToday) display = 'Сегодня, ' + display;
  document.getElementById('dateDisplay').textContent = display;

  var dayTasks = tasks[dk] || [];
  var list = document.getElementById('tasksList');
  list.innerHTML = '';
  if(dayTasks.length === 0){
    list.innerHTML = '<div class="empty-state">Нет задач на этот день<br><span style="font-size:13px;">Добавьте первую задачу выше</span></div>';
  } else {
    dayTasks.forEach(function(t, idx){
      var item = document.createElement('div');
      item.className = 'item' + (t.done ? ' done' : '');
      item.innerHTML =
        '<div class="item-checkbox' + (t.done ? ' checked' : '') + '" role="checkbox" tabindex="0" onclick="toggleTask(' + idx + ')" onkeypress="if(event.key===\'Enter\'||event.key===\' \')toggleTask(' + idx + ')"></div>' +
        '<div class="item-text">' + escapeHtml(t.text) + '</div>' +
        '<button class="item-delete" onclick="deleteTask(' + idx + ')">✕</button>';
      list.appendChild(item);
    });
  }
  var doneCount = dayTasks.filter(function(t){ return t.done; }).length;
  var total = dayTasks.length;
  document.getElementById('progressText').textContent = doneCount + ' / ' + total;
  document.getElementById('progressBar').style.width = (total > 0 ? (doneCount / total) * 100 : 0) + '%';
}
function addTask(){
  var inp = document.getElementById('taskInput');
  var text = inp.value.trim();
  if(!text){ showToast('Введите задачу', true); return; }
  var dk = dateKey(currentDate);
  if(!tasks[dk]) tasks[dk] = [];
  tasks[dk].push({ text: text, done: false, time: Date.now() });
  saveTasks(); inp.value = ''; renderTasks(); showToast('Задача добавлена');
}
function toggleTask(idx){
  var dk = dateKey(currentDate);
  if(!tasks[dk] || !tasks[dk][idx]) return;
  tasks[dk][idx].done = !tasks[dk][idx].done;
  saveTasks(); renderTasks();
}
function deleteTask(idx){
  var dk = dateKey(currentDate);
  if(!tasks[dk]) return;
  showConfirm('Удалить задачу?', function(){
    tasks[dk].splice(idx, 1); saveTasks(); renderTasks(); showToast('Задача удалена');
  });
}

/* ============================================================
   ПРИВЫЧКИ
   ============================================================ */
function getWeekStart(d){
  var day = d.getDay(); var diff = (day === 0 ? -6 : 1 - day);
  var start = new Date(d); start.setDate(start.getDate() + diff); start.setHours(0,0,0,0); return start;
}

function renderHabits(){
  var list = document.getElementById('habitsList'); list.innerHTML = '';
  if(habits.length === 0){
    list.innerHTML = '<div class="empty-state">Нет привычек<br><span style="font-size:13px;">Добавьте первую привычку выше</span></div>'; return;
  }
  var today = new Date(); today.setHours(0,0,0,0);
  var weekStart = getWeekStart(today);

  habits.forEach(function(h, hIdx){
    var card = document.createElement('div'); card.className = 'habit-card';
    var streak = calcStreak(h);
    var totalDone = Object.keys(h.days || {}).filter(function(k){ return h.days[k]; }).length;
    var weekDone = 0;
    
    for(var i=0;i<7;i++){
      var d = new Date(weekStart); d.setDate(d.getDate() + i);
      if(h.days && h.days[dateKey(d)]) weekDone++;
    }

    var html = '<div class="habit-header"><div class="habit-name">' + escapeHtml(h.name) + '</div>' +
      '<div class="habit-streak">Серия: ' + streak + '</div>' +
      '<button class="item-delete" onclick="deleteHabit(' + hIdx + ')">✕</button></div>';
    
    html += '<div class="habit-stats"><span>Всего: ' + totalDone + '</span><span>Неделя: ' + weekDone + '/7</span></div><div class="habits-grid">';
    
    for(var i=0;i<7;i++) html += '<div class="habit-day-header">' + DAYS_SHORT[i] + '</div>';
    
    var missedDayName = null;

    for(var i=0;i<7;i++){
      var d = new Date(weekStart); d.setDate(d.getDate() + i); var dk = dateKey(d);
      var isDone = h.days && h.days[dk]; 
      var isToday = d.getTime() === today.getTime(); 
      var isFuture = d.getTime() > today.getTime();
      var isPast = d.getTime() < today.getTime();

      var cls = 'habit-day';
      var onclick = '';

      if (isDone) {
        cls += ' done';
        if (isToday) onclick = ' onclick="toggleHabit(' + hIdx + ',\'' + dk + '\')"';
      } else if (isToday) {
        cls += ' today';
        onclick = ' onclick="toggleHabit(' + hIdx + ',\'' + dk + '\')"';
      } else if (isFuture) {
        cls += ' future';
      } else if (isPast) {
        cls += ' missed';
        var dayTasks = tasks[dk] || [];
        if (dayTasks.length === 0 && !missedDayName) {
            missedDayName = DAYS_SHORT[i];
        }
      }

      html += '<div class="' + cls + '"' + onclick + '></div>';
    }
    html += '</div>';

    if (missedDayName) {
      html += '<div class="fix-btn-wrapper">' +
              '<button class="fix-btn" onclick="fixMissedHabit(' + hIdx + ')">Исправить ' + missedDayName + '</button>' +
              '</div>';
    }

    card.innerHTML = html; 
    list.appendChild(card);
  });
}

function fixMissedHabit(hIdx) {
  var today = new Date(); today.setHours(0,0,0,0);
  var weekStart = getWeekStart(today);
  var h = habits[hIdx];
  if(!h) return;

  for(var i=0;i<7;i++){
    var d = new Date(weekStart); d.setDate(d.getDate() + i); 
    var dk = dateKey(d);
    var isPast = d.getTime() < today.getTime();
    var isDone = h.days && h.days[dk];
    var dayTasks = tasks[dk] || [];

    if (isPast && !isDone && dayTasks.length === 0) {
      showConfirm('Отметить привычку на ' + DAYS_SHORT[i] + '?', function(){
        if(!h.days) h.days = {};
        h.days[dk] = true;
        saveHabits();
        renderHabits();
        showToast('Исправлено за ' + DAYS_SHORT[i]);
      });
      return;
    }
  }
}

function addHabit(){
  var inp = document.getElementById('habitInput'); var text = inp.value.trim();
  if(!text){ showToast('Введите привычку', true); return; }
  habits.push({ name: text, days: {}, created: Date.now() });
  saveHabits(); inp.value = ''; renderHabits(); showToast('Привычка добавлена');
}
function toggleHabit(hIdx, dk){
  if(!habits[hIdx]) return;
  if(!habits[hIdx].days) habits[hIdx].days = {};
  habits[hIdx].days[dk] = !habits[hIdx].days[dk];
  saveHabits(); renderHabits();
}
function deleteHabit(hIdx){
  showConfirm('Удалить привычку?', function(){
    habits.splice(hIdx, 1); saveHabits(); renderHabits(); showToast('Привычка удалена');
  });
}
function calcStreak(h){
  if(!h.days) return 0; var streak = 0; var d = new Date(); d.setHours(0,0,0,0);
  while(true){
    var dk = dateKey(d);
    if(h.days[dk]){ streak++; d.setDate(d.getDate() - 1); }
    else {
      if(streak === 0){ d.setDate(d.getDate() - 1); var dk2 = dateKey(d); if(h.days[dk2]){ streak++; d.setDate(d.getDate() - 1); continue; } }
      break;
    }
  }
  return streak;
}

/* ============================================================
   ТРЕНИРОВКА (РАСПИСАНИЕ И ЛОГИКА)
   ============================================================ */
function selectDay(idx){
  if(training.started){ showToast('Сначала завершите тренировку', true); return; }
  currentDayIndex = idx;
  renderTraining();
}

function copyToDay(targetIdx){
  if(currentDayIndex === targetIdx) return;
  var srcList = exercisesData[currentDayIndex] || [];
  if(srcList.length === 0){
    showToast('Нечего копировать', true); return;
  }
  showConfirm('Скопировать тренировку в ' + DAYS_SHORT[targetIdx] + '? Текущий список будет заменен.', function(){
    exercisesData[targetIdx] = srcList.map(function(ex){
      return { name: ex.name, seconds: ex.seconds, id: Date.now() + Math.random() };
    });
    saveExercises();
    showToast('Скопировано в ' + DAYS_SHORT[targetIdx]);
    currentDayIndex = targetIdx;
    renderTraining();
  });
}

function addExercise(){
  if(training.started){ showToast('Тренировка идёт', true); return; }
  var nameInp = document.getElementById('exerciseInput');
  var timeInp = document.getElementById('exerciseTime');
  var name = nameInp.value.trim(); 
  
  var rawSec = timeInp.value.replace(/\D/g, ''); 
  var sec = parseInt(rawSec, 10);
  
  if(!name){ showToast('Введите название', true); return; }
  if(isNaN(sec) || sec < 5 || sec > 600){ showToast('Время 5-600 сек', true); return; }
  
  if(!exercisesData[currentDayIndex]) exercisesData[currentDayIndex] = [];
  
  exercisesData[currentDayIndex].push({ name: name, seconds: sec, id: Date.now() });
  exercisesData[currentDayIndex].push({ name: 'отдых', seconds: 15, id: Date.now() + 1 });
  
  saveExercises(); 
  nameInp.value = ''; 
  timeInp.value = '30';
  renderTraining(); 
  showToast('Упражнение добавлено (+15с отдых)');
}

function editExercise(idx){
  if(training.started) return;
  var ex = exercisesData[currentDayIndex][idx];
  if(!ex) return;

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = 
    '<div class="modal-text" style="margin-bottom:15px;">Редактировать</div>' +
    '<input type="text" id="editName" class="add-input" value="' + escapeHtml(ex.name) + '" style="width:100%;margin-bottom:10px;">' +
    '<input type="number" id="editTime" class="add-input" value="' + ex.seconds + '" style="width:100%;margin-bottom:20px;">' +
    '<div class="modal-actions">' +
      '<button class="btn" id="editCancel">Отмена</button>' +
      '<button class="btn btn-green" id="editSave">Сохранить</button>' +
    '</div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  box.querySelector('#editCancel').onclick = function(){ overlay.remove(); };
  box.querySelector('#editSave').onclick = function(){
    var newName = box.querySelector('#editName').value.trim();
    var newSec = parseInt(box.querySelector('#editTime').value.replace(/\D/g, ''), 10);
    if(!newName){ showToast('Введите название', true); return; }
    if(isNaN(newSec) || newSec < 5 || newSec > 600){ showToast('Время 5-600 сек', true); return; }
    
    exercisesData[currentDayIndex][idx].name = newName;
    exercisesData[currentDayIndex][idx].seconds = newSec;
    saveExercises();
    overlay.remove();
    renderTraining();
    showToast('Сохранено');
  };
}

function deleteExercise(idx){
  if(training.started){ showToast('Тренировка идёт', true); return; }
  showConfirm('Удалить упражнение?', function(){
    exercisesData[currentDayIndex].splice(idx, 1); 
    saveExercises(); 
    renderTraining(); 
    showToast('Упражнение удалено');
  });
}

var dragSrcIdx = null;
function handleDragStart(e, idx) {
  if(training.started) return;
  dragSrcIdx = idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', idx);
}
function handleDragOver(e, idx) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDrop(e, idx) {
  e.preventDefault();
  if(dragSrcIdx === null || dragSrcIdx === idx) return;
  var list = exercisesData[currentDayIndex];
  var item = list.splice(dragSrcIdx, 1)[0];
  list.splice(idx, 0, item);
  saveExercises();
  renderTraining();
}
function handleDragEnd(e) {
  document.querySelectorAll('.exercise-item').forEach(el => el.classList.remove('dragging'));
  dragSrcIdx = null;
}

function startTraining(){
  var list = exercisesData[currentDayIndex] || [];
  if(list.length === 0){ showToast('Сначала добавьте упражнения', true); return; }
  training.started = true;
  training.doneSet = {};
  training.activeIndex = -1;
  startExercise(0);
  showToast('Тренировка начата');
}

function startExercise(idx){
  var list = exercisesData[currentDayIndex] || [];
  if(idx < 0 || idx >= list.length) return;
  stopTimer();
  training.activeIndex = idx;
  training.total = list[idx].seconds;
  training.endTime = Date.now() + (list[idx].seconds * 1000);
  renderTraining();
  startTimer();
}

function startTimer(){
  stopTimer();
  updateTimerUI();
  
  training.timerId = setInterval(function(){
    var now = Date.now();
    var diff = training.endTime - now;
    
    if(diff <= 0){
      stopTimer();
      training.doneSet[training.activeIndex] = true;
      updateTimerUI();
      renderTraining();
      
      var list = exercisesData[currentDayIndex] || [];
      var nextEx = list[training.activeIndex + 1];
      var isCurrentRest = list[training.activeIndex].name.toLowerCase() === 'отдых';
      
      if(nextEx && nextEx.name.toLowerCase() === 'отдых' && !isCurrentRest) {
         startExercise(training.activeIndex + 1);
         showToast('Упражнение выполнено! Переход на отдых...');
      } else {
         if(isCurrentRest) showToast('Отдых окончен!');
         else showToast('Упражнение выполнено!');
      }
      return;
    }
    updateTimerUI();
  }, 200);
}

function stopTimer(){ if(training.timerId){ clearInterval(training.timerId); training.timerId = null; } }

function updateTimerUI(){
  var el = document.getElementById('activeExerciseTimer');
  var bar = document.getElementById('activeExerciseProgress');
  var hint = document.getElementById('trainingHint');
  var btn = document.getElementById('btnNextExercise');
  if(!el) return;

  var now = Date.now();
  var diff = training.endTime - now;
  var remaining = Math.max(0, Math.ceil(diff / 1000));
  var isDone = !!training.doneSet[training.activeIndex];

  el.textContent = formatTime(remaining);
  var pct = training.total > 0 ? ((training.total - remaining) / training.total) * 100 : 0;
  if(bar) bar.style.width = pct + '%';
  
  el.classList.toggle('finished', isDone);
  if(btn) btn.disabled = !isDone;
  
  if(hint){
    var list = exercisesData[currentDayIndex] || [];
    var isRest = list[training.activeIndex] && list[training.activeIndex].name.toLowerCase() === 'отдых';
    
    if (isDone) {
      hint.textContent = isRest ? 'Отдых окончен — нажмите «Следующее» для старта упражнения' : 'Упражнение выполнено — нажмите «Следующее»';
    } else {
      hint.textContent = isRest ? 'Восстановление сил...' : 'Дождитесь окончания таймера';
    }
  }
}

function nextExercise(){
  if(!training.doneSet[training.activeIndex]){
    showToast('Сначала завершите текущее', true); return;
  }
  var list = exercisesData[currentDayIndex] || [];
  var next = training.activeIndex + 1;
  
  if(next >= list.length){
    showToast('Все упражнения выполнены');
    training.activeIndex = -1; training.started = false;
    renderTraining(); return;
  }
  startExercise(next);
}

function resetTraining(){
  showConfirm('Сбросить тренировку?', function(){
    stopTimer();
    training.activeIndex = -1; training.endTime = 0; training.total = 0;
    training.doneSet = {}; training.started = false;
    renderTraining(); showToast('Тренировка сброшена');
  });
}

function renderTraining(){
  var list = document.getElementById('exercisesList');
  var activeBox = document.getElementById('trainingActive');
  var form = document.getElementById('exerciseForm');
  var startBox = document.getElementById('startTrainingBox');
  var copyMenu = document.getElementById('copyMenu');
  
  list.innerHTML = '';

  var dayBtns = document.querySelectorAll('.week-day-btn');
  var todayIdx = (new Date().getDay() + 6) % 7;
  dayBtns.forEach(function(btn, i) {
    btn.classList.toggle('active', i === currentDayIndex);
    btn.classList.toggle('today', i === todayIdx);
  });

  var currentList = exercisesData[currentDayIndex] || [];

  if(training.started) {
    form.classList.add('hidden');
    copyMenu.style.display = 'none';
  } else {
    form.classList.remove('hidden');
    copyMenu.style.display = 'flex';
  }

  if(currentList.length === 0){
    activeBox.style.display = 'none'; startBox.style.display = 'none';
    list.innerHTML = '<div class="empty-state">Нет упражнений на ' + DAYS_SHORT[currentDayIndex] + '<br><span style="font-size:13px;">Добавьте первое упражнение выше</span></div>';
    return;
  }

  if(!training.started && training.activeIndex === -1){
    startBox.style.display = 'block';
    var total = currentList.reduce(function(s, e){ return s + e.seconds; }, 0);
    document.getElementById('startTrainingHint').textContent =
      'Упражнений: ' + currentList.length + ' • Общее время: ' + formatTime(total);
  } else {
    startBox.style.display = 'none';
  }

  if(training.activeIndex >= 0 && training.activeIndex < currentList.length){
    activeBox.style.display = 'block';
    document.getElementById('activeExerciseName').textContent = escapeHtml(currentList[training.activeIndex].name);
    document.getElementById('activeExerciseStep').textContent = (training.activeIndex + 1) + ' / ' + currentList.length;
    updateTimerUI();
  } else {
    activeBox.style.display = 'none';
  }

  currentList.forEach(function(ex, idx){
    var done = !!training.doneSet[idx];
    var isActive = training.activeIndex === idx;
    var isRest = ex.name.toLowerCase() === 'отдых';
    
    var cls = 'exercise-item';
    if(done) cls += ' done';
    if(isActive) cls += ' active';

    var item = document.createElement('div');
    item.className = cls;
    item.draggable = !training.started; 
    
    item.ondragstart = function(e) { handleDragStart(e, idx); };
    item.ondragover = function(e) { handleDragOver(e, idx); };
    item.ondrop = function(e) { handleDrop(e, idx); };
    item.ondragend = handleDragEnd;

    var actionHtml = '';
    if(done){
      actionHtml = '<span class="exercise-time" style="background:var(--success-bg);color:var(--success);">Готово</span>';
    } else if(isActive){
      actionHtml = '<span class="exercise-time" style="background:var(--primary-light);color:var(--primary);">Идёт</span>';
    }

    var handleHtml = training.started ? '' : '<div class="drag-handle">⋮⋮</div>';
    var editBtn = training.started ? '' : '<button class="item-edit" onclick="editExercise(' + idx + ')">✎</button>';
    var deleteBtn = training.started ? '' : '<button class="item-delete" onclick="deleteExercise(' + idx + ')">✕</button>';
    var timeCls = isRest ? 'exercise-time rest' : 'exercise-time';

    item.innerHTML =
      handleHtml +
      '<div class="exercise-num">' + (idx + 1) + '</div>' +
      '<div class="exercise-name">' + escapeHtml(ex.name) + '</div>' +
      '<span class="' + timeCls + '">' + formatTime(ex.seconds) + '</span>' +
      actionHtml +
      editBtn +
      deleteBtn;

    list.appendChild(item);
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('taskInput').addEventListener('keypress', function(e){ if(e.key === 'Enter') addTask(); });
  document.getElementById('habitInput').addEventListener('keypress', function(e){ if(e.key === 'Enter') addHabit(); });
  document.getElementById('exerciseInput').addEventListener('keypress', function(e){ if(e.key === 'Enter') addExercise(); });
  document.getElementById('exerciseTime').addEventListener('keypress', function(e){ if(e.key === 'Enter') addExercise(); });
  renderTasks();
});
</script>
</body>
